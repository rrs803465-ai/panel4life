{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Delete Account</h2>
  <div class="flash" style="border-left-color:var(--danger)">
    This permanently deletes your account and destroys your VPS. This cannot be undone.
  </div>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="code" placeholder="Your 6-character recovery code" maxlength="6" required style="text-transform:uppercase">
    <div style="margin-top:12px"><button type="submit" class="btn-danger">Permanently Delete My Account</button></div>
  </form>
  <p style="margin-top:14px"><a href="{{ url_for('dashboard') }}">&larr; Cancel, go back</a></p>
</div>
{% endblock %}
