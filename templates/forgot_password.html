{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Forgot Password</h2>
  <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:14px">
    Enter your username and the recovery code you saved when you first logged in.
  </p>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="text" name="code" placeholder="Recovery code" maxlength="6" required style="text-transform:uppercase">
    <div style="margin-top:12px"><button type="submit">Continue</button></div>
  </form>
  <p style="margin-top:14px"><a href="{{ url_for('login') }}">&larr; Back to Login</a></p>
</div>
{% endblock %}
