{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Register</h2>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <div style="margin-top:12px"><button type="submit">Register</button></div>
  </form>
  <p style="margin-top:10px"><a href="{{ url_for('login') }}">Already have an account? Login</a></p>
</div>
{% endblock %}
