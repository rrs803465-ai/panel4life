{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Set New Password</h2>
  {% if error %}<div class="flash">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="New password" required>
    <div style="margin-top:12px"><button type="submit">Reset Password</button></div>
  </form>
</div>
{% endblock %}
